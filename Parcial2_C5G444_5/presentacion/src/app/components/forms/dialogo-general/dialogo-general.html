<h2 mat-dialog-title>{{data.titulo}}</h2>
<mat-dialog-content>
    <p>{{data.texto}}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    @if(data.textoCancelar) {
        <button mat-stroked-button mat-dialog-close>{{data.textoCancelar}}</button>
    }
    @if(data.textoAceptar) {
        <button mat-flat-button [mat-dialog-close]="true" cdkFocusInitial>{{data.textoAceptar}}</button>
    }
</mat-dialog-actions>
