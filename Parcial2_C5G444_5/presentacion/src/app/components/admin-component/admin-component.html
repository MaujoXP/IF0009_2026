<div class="max-w-6xl mx-auto p-4">
  <h2 class="text-2xl text-center mb-4">Administrador</h2>

  <div class="flex flex-wrap justify-center items-center gap-4">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Nombre</mat-label>
      <input matInput [formField]="frmFilter.nombre" (keyup.enter)="buscar()" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Correo</mat-label>
      <input matInput [formField]="frmFilter.correo" (keyup.enter)="buscar()" />
    </mat-form-field>
    <button mat-flat-button type="button" (click)="buscar()">Filtrar</button>
    <button mat-stroked-button type="button" (click)="limpiarFiltro()">Limpiar</button>
  </div>

  <div class="flex justify-end my-4">
    <button mat-flat-button type="button" (click)="onCreate()">Nuevo</button>
  </div>

  <div class="overflow-x-auto">
    <table mat-table [dataSource]="dataSource()" class="w-full">
      <ng-container matColumnDef="idUsuario">
        <th mat-header-cell *matHeaderCellDef> Id Usuario </th>
        <td mat-cell *matCellDef="let admin"> {{admin.idUsuario}} </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let admin"> {{admin.nombre}} </td>
      </ng-container>

      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef> Correo </th>
        <td mat-cell *matCellDef="let admin"> {{admin.correo}} </td>
      </ng-container>



      <ng-container matColumnDef="direccion">
        <th mat-header-cell *matHeaderCellDef> Dirección </th>
        <td mat-cell *matCellDef="let admin"> {{admin.direccion}} </td>
      </ng-container>

      <ng-container matColumnDef="botonera">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
        <td mat-cell *matCellDef="let admin">
          <div class="flex gap-2 justify-center">
            <button mat-stroked-button type="button" (click)="onEdit(admin.idUsuario)">Modificar</button>
            <button mat-stroked-button type="button" (click)="onDelete(admin)">Eliminar</button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  @if (dataSource().length === 0) {
    <p class="text-center p-4">{{ mensajeVacio() }}</p>
  }
</div>
